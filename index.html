<!doctype html>
<html lang="en-NZ">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f5f1" />
    <meta
      name="description"
      content="Wai puts sensors in your paddocks and waterways. The app tells you when something changes, why, and what to do next."
    />
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="Wai: water and soil monitoring for NZ farms"
    />
    <meta
      property="og:description"
      content="Wai puts sensors in your paddocks and waterways. The app tells you when something changes, why, and what to do next."
    />
    <meta property="og:image" content="/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Wai: water and soil monitoring for NZ farms"
    />
    <meta
      name="twitter:description"
      content="Wai puts sensors in your paddocks and waterways. The app tells you when something changes, why, and what to do next."
    />
    <meta name="twitter:image" content="/og.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Chivo:wght@400;500;600;700&family=Chivo+Mono:wght@400;500&family=Archivo:wdth,wght@125,600&display=swap"
      rel="stylesheet"
    />
    <script>
      try {
        if (sessionStorage.getItem('wai:loaded'))
          document.documentElement.classList.add('no-loader')
      } catch {}
    </script>
    <style>
      .no-loader #loader {
        display: none;
      }
      #loader {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: grid;
        place-items: center;
        background: #f6f5f1;
        color: rgb(20 20 18 / 0.55);
        /* System font only, so the text does not swap when the web fonts arrive. */
        font:
          11px/16px ui-monospace,
          SFMono-Regular,
          Menlo,
          Consolas,
          monospace;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        transition: opacity 300ms ease;
      }
      #loader.done {
        opacity: 0;
        pointer-events: none;
      }
    </style>
    <title>Wai: water and soil monitoring for NZ farms</title>
  </head>
  <body>
    <div id="loader" role="status" aria-live="polite">Loading...</div>
    <script>
      // Loading screen. Hides once the fonts are in and the farm map scene
      // has built (wai:farm-ready from FarmScene), or after 10 s at most.
      ;(() => {
        const loader = document.getElementById('loader')
        if (document.documentElement.classList.contains('no-loader'))
          return loader.remove()
        const MAX_MS = 10000
        const farmReady = new Promise((resolve) =>
          addEventListener('wai:farm-ready', resolve, { once: true }),
        )
        let done = false
        const finish = () => {
          if (done) return
          done = true
          loader.remove()
          try {
            sessionStorage.setItem('wai:loaded', '1')
          } catch {}
          dispatchEvent(new Event('wai:loader-done'))
        }
        const hide = () => {
          loader.classList.add('done')
          loader.addEventListener('transitionend', finish)
          setTimeout(finish, 500)
        }
        Promise.all([
          document.fonts.load('16px Chivo'),
          document.fonts.load('11px "Chivo Mono"'),
          document.fonts.load('600 expanded 28px Archivo'),
          farmReady,
        ]).then(hide, hide)
        setTimeout(hide, MAX_MS)
      })()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
