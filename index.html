<!doctype html>
<html lang="en-NZ">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f5f1" />
    <meta
      name="description"
      content="Wai puts sensors in your paddocks and waterways. The app tells you when something changes, why, and what to do next."
    />
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="Wai: water and soil monitoring for NZ farms"
    />
    <meta
      property="og:description"
      content="Wai puts sensors in your paddocks and waterways. The app tells you when something changes, why, and what to do next."
    />
    <meta property="og:image" content="/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Wai: water and soil monitoring for NZ farms"
    />
    <meta
      name="twitter:description"
      content="Wai puts sensors in your paddocks and waterways. The app tells you when something changes, why, and what to do next."
    />
    <meta name="twitter:image" content="/og.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script>
      try {
        if (sessionStorage.getItem('wai:loaded'))
          document.documentElement.classList.add('no-loader')
      } catch {}
      // Show the loader mark 200 ms after the first paint. main.tsx reads
      // data-shown to let the current ping finish.
      setTimeout(() => {
        const loader = document.getElementById('loader')
        if (!loader || loader.classList.contains('done')) return
        loader.dataset.shown = performance.now()
        loader.classList.add('show')
      }, 200)
    </script>
    <style>
      .no-loader #loader {
        display: none;
      }
      #loader {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: grid;
        place-items: center;
        background: #f6f5f1;
        transition: opacity 400ms cubic-bezier(0.3, 0, 0.8, 0.15) 100ms;
      }
      #loader.done {
        opacity: 0;
        pointer-events: none;
      }
      .loader-mark {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 24px;
        opacity: 0;
        transition: opacity 200ms ease;
      }
      #loader.show .loader-mark {
        opacity: 1;
      }
      #loader.done .loader-mark {
        opacity: 0;
      }
      .loader-mark svg {
        display: block;
        width: 160px;
        height: 160px;
        overflow: visible;
      }
      .loader-mark circle {
        vector-effect: non-scaling-stroke;
      }
      .loader-ping {
        opacity: 0;
        transform-box: fill-box;
        transform-origin: center;
      }
      #loader.show .loader-ping {
        animation: loader-ping 1400ms cubic-bezier(0.05, 0.7, 0.1, 1) infinite;
      }
      #loader.done .loader-ping {
        animation: none;
      }
      .loader-label {
        height: 16px;
        font:
          11px/16px 'JetBrains Mono',
          ui-monospace,
          monospace;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: rgb(20 20 18 / 0.55);
      }
      .loader-sr {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }
      @keyframes loader-ping {
        from {
          transform: scale(0.06);
          opacity: 0;
        }
        8% {
          opacity: 0.9;
        }
        to {
          transform: scale(1);
          opacity: 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .loader-ping {
          display: none;
        }
        #loader {
          transition: opacity 150ms ease;
        }
        .loader-mark {
          transition-duration: 150ms;
        }
      }
    </style>
    <title>Wai: water and soil monitoring for NZ farms</title>
  </head>
  <body>
    <div id="loader">
      <div class="loader-sr" role="status" aria-live="polite">Loading Wai</div>
      <div class="loader-mark">
        <svg viewBox="0 0 160 160" aria-hidden="true">
          <g
            fill="none"
            stroke="#141412"
            stroke-opacity="0.18"
            stroke-width="1"
            stroke-dasharray="1 4"
            stroke-linecap="round"
          >
            <circle cx="80" cy="80" r="36" />
            <circle cx="80" cy="80" r="64" />
          </g>
          <circle
            class="loader-ping"
            cx="80"
            cy="80"
            r="72"
            fill="none"
            stroke="#3a9d5d"
            stroke-width="1"
          />
          <circle cx="80" cy="80" r="4" fill="#3a9d5d" />
        </svg>
        <div class="loader-label">Connecting sensors</div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
